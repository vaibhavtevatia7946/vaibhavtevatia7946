      .sub-badge { fill: #24283b; }
      .sub-text { fill: #9aa5ce; font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; font-weight: 600; }
      .pulse-dot { fill: #70e000; }
      .grid-line { stroke: #24283b; stroke-width: 1; }
      .axis-label { fill: #565f89; font-family: 'SF Pro Display', -apple-system, monospace; font-size: 10px; font-weight: 600; }
      .area-stop-top { stop-color: #7aa2f7; stop-opacity: 0.45; }
      .area-stop-mid { stop-color: #7aa2f7; stop-opacity: 0.12; }
      .area-stop-bot { stop-color: #7aa2f7; stop-opacity: 0.0; }
      .line-main { stroke: url(#lineGrad); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dot-halo { fill: #7aa2f7; fill-opacity: 0.25; }
      .dot-core { fill: #bb9af7; stroke: #1a1b26; stroke-width: 1.5; }
      .peak-bg { fill: #24283b; stroke: #7aa2f7; stroke-width: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }
      .peak-text { fill: #7aa2f7; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; }
      .peak-arrow { fill: #7aa2f7; }

      @media (prefers-color-scheme: light) {
        .card-bg { fill: #ffffff; stroke: #e1e4e8; }
        .title-text { fill: #0969da; }
        .sub-badge { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
        .sub-text { fill: #57606a; }
        .grid-line { stroke: #eaecef; }
        .axis-label { fill: #6e7781; }
        .area-stop-top { stop-color: #218bff; stop-opacity: 0.35; }
        .area-stop-mid { stop-color: #218bff; stop-opacity: 0.08; }
        .area-stop-bot { stop-color: #218bff; stop-opacity: 0.0; }
        .dot-core { fill: #0969da; stroke: #ffffff; }
        .dot-halo { fill: #218bff; fill-opacity: 0.25; }
        .peak-bg { fill: #f6f8fa; stroke: #0969da; }
        .peak-text { fill: #0969da; }
        .peak-arrow { fill: #0969da; }
      }
    </style>
