      .area-stop-bot { stop-color: #218bff; stop-opacity: 0.0; }
      .line-main { stroke: url(#lineGrad); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dot-halo { fill: #218bff; fill-opacity: 0.25; }
      .dot-core { fill: #0969da; stroke: #ffffff; stroke-width: 1.5; }
      .peak-bg { fill: #f6f8fa; stroke: #0969da; stroke-width: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }
      .peak-text { fill: #0969da; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; }
      .peak-arrow { fill: #0969da; }

